steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - cron_job/Dockerfile
      - -t
      - $_IMAGE
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/artemis-418513/ona-jobs/daily-pipeline-cron-job:v1

images:
  - $_IMAGE
