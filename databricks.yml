bundle:
  name: ona-mlops-e2e

include:
  - resources/*.job.yml

permissions:
  - group_name: artemis-technical
    level: CAN_MANAGE
  - user_name: bjmehta2001@gmail.com
    level: CAN_MANAGE
  - service_principal_name: 30ae320f-306a-4b4c-be28-b833f978af59
    level: CAN_RUN

variables:
  batching_job_id:
    description: Deployed image_batching job ID.
    default: "220147886089186"
  qscoring_job_id:
    description: Deployed image_qscoring job ID.
    default: "971178647304233"
  selection_job_id:
    description: Deployed image_selection job ID.
    default: "1067761819350011"
  trait_extraction_job_id:
    description: Deployed Trait Extraction job ID.
    default: "923995367676666"

  source_volume:
    default: "/Volumes/use1_prod_artemis_catalog_3718194974443840/production/data/ona-harvest"
  image_volume_root:
    default: "/Volumes/use1_prod_artemis_catalog_3718194974443840/production/data"
  selected_images_root:
    default: "/Volumes/use1_prod_artemis_catalog_3718194974443840/production/data/artemis"
  pipeline_runs_root:
    default: "/Volumes/use1_prod_artemis_catalog_3718194974443840/production/data/ona-harvest/pipeline_runs"

  inference_confidence:
    default: "0.5"
  inference_limit:
    description: High default means process all selected images while retaining the child-job contract.
    default: "1000000"
  inference_num_partitions:
    default: "4"
  route_concurrency:
    description: Maximum concurrent crop/trait/protocol inference or extraction routes.
    default: 3
  fail_on_unsupported_traits:
    default: "true"
  trait_extraction_firestore_upload:
    default: "true"

targets:
  dev:
    mode: development
    default: true
    variables:
      # The dev E2E job uses the serverless extraction deployment. Production
      # retains the larger single-node job for memory-heavy flowering runs.
      trait_extraction_job_id: "502899940876299"
      trait_extraction_firestore_upload: "false"
    run_as:
      service_principal_name: 30ae320f-306a-4b4c-be28-b833f978af59
    workspace:
      host: https://dbc-cc63cc0e-9e9b.cloud.databricks.com

  prod:
    mode: production
    run_as:
      service_principal_name: 30ae320f-306a-4b4c-be28-b833f978af59
    workspace:
      host: https://dbc-cc63cc0e-9e9b.cloud.databricks.com
