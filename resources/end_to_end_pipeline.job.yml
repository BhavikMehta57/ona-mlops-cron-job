resources:
  jobs:
    ona_e2e_pipeline:
      name: "ONA - End to End Pipeline"
      max_concurrent_runs: 1

      parameters:
        - name: input_csv
          default: ""
        - name: run_root
          default: "${var.pipeline_runs_root}/{{job.run_id}}"
        - name: inference_confidence
          default: "${var.inference_confidence}"
        - name: inference_limit
          default: "${var.inference_limit}"
        - name: inference_num_partitions
          default: "${var.inference_num_partitions}"

      environments:
        - environment_key: default
          spec:
            client: "1"

      tasks:
        - task_key: preprocessing_batching
          run_job_task:
            job_id: ${var.batching_job_id}
            job_parameters:
              run_id: "{{job.run_id}}"
              input_csv: "{{job.parameters.input_csv}}"
              source_volume: "${var.source_volume}"
              run_root: "{{job.parameters.run_root}}"
              fail_on_unsupported_traits: "${var.fail_on_unsupported_traits}"

        - task_key: preprocessing_qscoring
          depends_on:
            - task_key: preprocessing_batching
          run_job_task:
            job_id: ${var.qscoring_job_id}
            job_parameters:
              run_id: "{{job.run_id}}"
              input_manifest: "{{job.parameters.run_root}}/manifests/batching.json"
              image_volume_root: "${var.image_volume_root}"
              run_root: "{{job.parameters.run_root}}"

        - task_key: preprocessing_selection
          depends_on:
            - task_key: preprocessing_qscoring
          run_job_task:
            job_id: ${var.selection_job_id}
            job_parameters:
              run_id: "{{job.run_id}}"
              input_manifest: "{{job.parameters.run_root}}/manifests/qscoring.json"
              image_volume_root: "${var.image_volume_root}"
              selected_images_root: "${var.selected_images_root}"
              run_root: "{{job.parameters.run_root}}"

        - task_key: build_routes
          depends_on:
            - task_key: preprocessing_selection
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/build_routes.py
            base_parameters:
              selection_manifest: "{{job.parameters.run_root}}/manifests/selection.json"
              run_root: "{{job.parameters.run_root}}"
              fail_on_unsupported_traits: "${var.fail_on_unsupported_traits}"
              trait_extraction_firestore_upload: "${var.trait_extraction_firestore_upload}"

        - task_key: batch_inference
          depends_on:
            - task_key: build_routes
          for_each_task:
            inputs: '{{tasks.build_routes.values.routes}}'
            concurrency: ${var.route_concurrency}
            task:
              task_key: batch_inference_iteration
              run_job_task:
                job_id: ${resources.jobs.image_inference.id}
                job_parameters:
                  run_id: "{{job.run_id}}-{{input.group_key}}"
                  input_prefix: "{{input.input_prefix}}"
                  input_mode: "glob"
                  save_json_folder: "{{input.inference_output_dir}}"
                  trait_type: "{{input.inference_trait_type}}"
                  confidence: "{{job.parameters.inference_confidence}}"
                  limit: "{{job.parameters.inference_limit}}"
                  num_partitions: "{{job.parameters.inference_num_partitions}}"

        - task_key: trait_extraction
          depends_on:
            - task_key: batch_inference
          for_each_task:
            inputs: '{{tasks.build_routes.values.routes}}'
            concurrency: ${var.route_concurrency}
            task:
              task_key: trait_extraction_iteration
              run_job_task:
                job_id: ${var.trait_extraction_job_id}
                job_parameters:
                  run_spec_json: "{{input.run_spec_json}}"

        - task_key: aggregate_results
          depends_on:
            - task_key: trait_extraction
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/aggregate_results.py
            base_parameters:
              run_root: "{{job.parameters.run_root}}"
              route_manifest: "{{tasks.build_routes.values.route_manifest}}"
              selection_manifest: "{{job.parameters.run_root}}/manifests/selection.json"

      queue:
        enabled: true
